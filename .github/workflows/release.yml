name: Release

# Pushing a tag like v0.3.0 publishes a GitHub release whose notes are that version's
# CHANGELOG.md section, with the pipx install line on top. scripts/release_notes.py refuses
# (and the job fails, so nothing is published) if the tag and the code disagree on the version.
# Then the same version is uploaded to PyPI with trusted publishing: PyPI checks that the upload
# comes from this repository's release.yml in the "pypi" environment, so no token is stored.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Release notes from CHANGELOG.md
        run: python3 scripts/release_notes.py "$GITHUB_REF_NAME" > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag

  pypi:
    needs: release
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/soul-toolkit/
    permissions:
      id-token: write   # proves to PyPI where the upload comes from
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Build the sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Check the built version matches the tag
        run: test -f "dist/soul_toolkit-${GITHUB_REF_NAME#v}-py3-none-any.whl"
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
