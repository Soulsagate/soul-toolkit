[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "soul-toolkit"
version = "0.1.0"
description = "A modular pentest toolkit for authorized labs and CTFs. Flagship command: staged, service-aware recon."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "S0uls" }]
keywords = ["pentest", "recon", "nmap", "gobuster", "ctf", "tryhackme", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: Security",
    "Intended Audience :: Information Technology",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
toolkit = "soul_toolkit.cli:main"
soul-toolkit = "soul_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soul_toolkit = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
