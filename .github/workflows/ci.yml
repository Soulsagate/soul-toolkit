name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the tools recon wraps (tests that need a missing one are skipped)
        run: |
          sudo apt-get update -qq
          for pkg in nmap gobuster ffuf snmp snmpd onesixtyone redis-server nfs-common; do
            sudo apt-get install -y -qq "$pkg" || echo "::warning::$pkg not available, its tests will be skipped"
          done
      - run: pip install -e '.[dev]'
      - run: pytest -q
        env:
          SOUL_SKIP_LAB: "1"   # the lab job below runs it once instead of five times

  lab:
    # Builds the vulnerable lab in tests/lab/ and runs a real recon against it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install the tools recon wraps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nmap gobuster ffuf smbclient nfs-common
      - run: pip install -e '.[dev]'
      - run: pytest -q -rs tests/test_lab.py
        env:
          SOUL_REQUIRE_LAB: "1"  # fail, don't skip, if Docker or a tool is missing
      - name: Lab logs on failure
        if: failure()
        run: docker compose -f tests/lab/docker-compose.yml logs --tail 50 || true
