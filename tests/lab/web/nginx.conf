# :80 - name-based virtual hosts. Asking by IP (or any unknown name) redirects to lab.thm.
server {
    listen 80 default_server;
    server_name _;
    return 302 http://lab.thm/;
}
server {
    listen 80;
    server_name lab.thm;
    root /var/www/lab;
}
server {
    listen 80;
    server_name dev.lab.thm;     # not linked anywhere - only vhost fuzzing finds it
    root /var/www/dev;
}

# :8080 - an app served straight from its git checkout (so /.git is readable).
server {
    listen 8080 default_server;
    server_name _;
    root /var/www/app;
    autoindex off;
}
