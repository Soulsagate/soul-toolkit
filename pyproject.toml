[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "soul-toolkit"
version = "0.3.1"
description = "Recon for authorized labs and CTFs: staged nmap plus per-service checks, ending in a ranked 'Where to start' list."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "S0uls" }]
keywords = ["pentest", "recon", "nmap", "gobuster", "ctf", "tryhackme", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console",
    "Topic :: Security",
    "Intended Audience :: Information Technology",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Soulsagate/soul-toolkit"
Documentation = "https://github.com/Soulsagate/soul-toolkit/blob/main/docs/getting-started.md"
Changelog = "https://github.com/Soulsagate/soul-toolkit/blob/main/CHANGELOG.md"
Issues = "https://github.com/Soulsagate/soul-toolkit/issues"

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
toolkit = "soul_toolkit.cli:main"
soul-toolkit = "soul_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
soul_toolkit = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # reports use emoji and typographic dashes on purpose
