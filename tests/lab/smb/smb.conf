# Deliberately weak: anonymous (null session) share listing and a guest-readable share.
[global]
   workgroup = LAB
   server string = Lab file server
   server role = standalone server
   map to guest = Bad User
   restrict anonymous = 0
   server signing = disabled
   disable netbios = no
   smb ports = 445 139
   log level = 1

[public]
   comment = Public files
   path = /srv/public
   browseable = yes
   read only = yes
   guest ok = yes
