# Deliberately weak: /srv/nfs exported read-only to every client, root not squashed.
NFS_CORE_PARAM {
    Protocols = 3, 4;
    MNT_Port = 20048;
}
EXPORT {
    Export_Id = 1;
    Path = /srv/nfs;
    Pseudo = /srv/nfs;
    Protocols = 3, 4;
    Transports = TCP;
    Access_Type = RO;
    Squash = No_Root_Squash;
    FSAL { Name = VFS; }
    CLIENT { Clients = *; Access_Type = RO; }
}
